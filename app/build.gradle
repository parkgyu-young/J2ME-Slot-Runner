plugins {
    id 'com.android.application'
}

android {
    compileSdk COMPILE_SDK
    ndkVersion NDK_VERSION
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        // J2ME Slot Runner: own application id, Java namespace stays upstream's
        // (ru.playsoftware.j2meloader) to keep the emulator core untouched.
        applicationId "com.example.j2meslots"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 1
        versionName "1.0.0"
        resValue 'string', 'app_name', 'J2ME Slot Runner'
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
        // Number of statically declared slots (must match tools/gen_slots.py output)
        buildConfigField 'int', 'SLOT_COUNT', '20'
        ndk {
            // Override with -PslotAbis=arm64-v8a,x86_64 if needed
            abiFilters.addAll((project.findProperty('slotAbis') ?: 'arm64-v8a,armeabi-v7a,x86').toString().split(','))
        }
    }

    androidResources {
        generateLocaleConfig true
    }

    signingConfigs {
        release {
            Properties keystoreProps = new Properties()
            File keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        debug {
            jniDebuggable true
            multiDexEnabled true
            multiDexKeepProguard file('multidex-config.pro')
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
        abortOnError false
    }

    packaging {
        jniLibs {
            // android:extractNativeLibs="true"
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_21
        sourceCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
        resValues true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { versionName ->
                "J2ME-Slot-Runner-${versionName}-${variant.buildType}.apk"
            })
        }
    }
}

dependencies {
    def roomVersion = '2.8.5'
    def cameraxVersion = "1.6.2"
    def autoServiceVersion = "1.1.1"

    implementation project(':dexlib')

    // Android Jetpack
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.activity:activity:1.13.0"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0' // api21
    implementation 'androidx.preference:preference:1.2.1'

    // Networking && APIs
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.2-android'

    // Threads, Streams and Archives
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    // Audio/Video/Graphics
    implementation 'com.github.nikita36078:pngj:2.2.3'
    implementation 'io.github.nikita36078:ffmpeg-kit:6.0.LTS'
    implementation "com.google.oboe:oboe:1.11.0"

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Android UI
    implementation 'com.github.nikita36078:filepicker:4.3.0'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    // J2ME Slot Runner: encrypted storage for proxy credentials
    implementation 'androidx.security:security-crypto:1.1.0'

    // Testing && CrashReports
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'ch.acra:acra-dialog:5.14.2'

    def kotlinMetadataVersion = "2.4.21"
    annotationProcessor("org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlinMetadataVersion")
    compileOnly "com.google.auto.service:auto-service-annotations:$autoServiceVersion"
    annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
}
